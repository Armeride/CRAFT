# Protected-file report. Protected file (see AGENTS.md).
# Lists quality-gate changes in a PR (tools/quality/**, .semgrep/**, AGENTS.md, .github/**,
# tsconfig*, gate scripts in package.json, baseline growth) as warnings and in the job
# summary. It does not fail: agents open PRs through GitHub Apps that can also label PRs,
# so enforcement is the main ruleset (1 approval + Code Owner review, .github/CODEOWNERS).
# Not a required check.
name: quality-guard

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: quality-guard-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  guard:
    name: guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Report protected files and baseline growth
        env:
          BASE_REF: ${{ github.base_ref }}
        run: node tools/quality/run.mjs guard --base "origin/$BASE_REF"
